name: Bug report
description: Something does not work as documented.
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time! **Security issues: do not open a public issue** — see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command / request and the full error output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. citewell ingest ./docs
        2. citewell search "..."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `citewell doctor`
      render: text
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [docker compose, uv / pip, other]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: MCP client (if relevant)
      placeholder: Claude Desktop 1.x, Claude Code, Cursor …
