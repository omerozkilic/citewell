name: Publish image

# Called by release-please after a release, or run by hand to (re)publish a version:
#   Actions → Publish image → Run workflow → version 0.1.0, ref v0.1.0
on:
  workflow_call:
    inputs:
      version:
        description: Version without the "v" prefix, e.g. 0.1.0
        required: true
        type: string
      ref:
        description: Git tag or commit to build
        required: true
        type: string
      latest:
        description: Also tag the image as latest
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: Version without the "v" prefix, e.g. 0.1.0
        required: true
        type: string
      ref:
        description: Git tag or commit to build, e.g. v0.1.0
        required: true
        type: string
      latest:
        description: Also tag the image as latest
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.2.3 (got '$VERSION')"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
