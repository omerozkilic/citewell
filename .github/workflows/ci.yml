name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src

  test:
    name: Test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: citewell
          POSTGRES_PASSWORD: citewell
          POSTGRES_DB: citewell_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citewell"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CITEWELL_TEST_DATABASE_URL: postgresql://citewell:citewell@localhost:5432/citewell_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term --cov-fail-under=85
      - name: Upload coverage
        if: matrix.python == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  eval:
    name: Retrieval eval (smoke)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: citewell
          POSTGRES_PASSWORD: citewell
          POSTGRES_DB: citewell
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U citewell"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CITEWELL_DATABASE_URL: postgresql://citewell:citewell@localhost:5432/citewell
      # Lexical hash embeddings: checks the pipeline end-to-end without model downloads.
      CITEWELL_EMBEDDING_BACKEND: hash
      CITEWELL_RERANKER_BACKEND: lexical
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run citewell init
      - run: uv run citewell ingest examples/corpus
      - run: uv run citewell ingest examples/corpus-en -c handbook-en -l english
      - name: Evaluate
        run: |
          uv run citewell eval examples/eval/tr-sample.jsonl \
            -r vector,keyword,hybrid,hybrid+rerank --markdown -o eval-report.json --fail-under 0.8 \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: eval-report.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: WITH_MODELS=false
          tags: citewell:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
